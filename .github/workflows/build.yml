# Forge 1.20.1 build check — verifies the primary target compiles cleanly on every push.
# Jars land in dist/ and are uploaded as artifacts.

name: Build (Forge 1.20.1)

on:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # version string comes from `git describe --always --tags --first-parent`

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :forge:build --console=plain

    - name: Archive dist jars
      uses: actions/upload-artifact@v7
      with:
        name: forge-dist
        path: dist/
